name: Bug Report
description: 报告一个 bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 bug 报告！

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请描述遇到的问题
      placeholder: 详细描述 bug...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: 描述期望的行为...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 如何重现这个问题？
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Flarum 版本
      description: 你使用的 Flarum 版本是？
      options:
        - 1.8.x
        - 1.7.x
        - 1.6.x
        - 其他
    validations:
      required: true

  - type: dropdown
    id: php-version
    attributes:
      label: PHP 版本
      description: 你使用的 PHP 版本是？
      options:
        - "8.2"
        - "8.1"
        - "8.0"
        - "7.4"
        - "7.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请复制粘贴相关的日志输出
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其他你认为有用的信息
