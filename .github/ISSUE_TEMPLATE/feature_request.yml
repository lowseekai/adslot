name: Feature Request
description: 建议一个新功能
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！我们重视每一个功能请求。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能请求是否与某个问题相关？
      placeholder: 我总是遇到这样的问题...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望如何解决这个问题？
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
      placeholder: 我也考虑过...

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其他你认为有用的信息、截图等
